<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="268" viewBox="0 0 1000 268" role="img" aria-label="Ejemplo de salida de /find-problems: dos puntos, Arreglar primero y Arreglar pronto, y una nota de almacenamiento" font-family="Söhne,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="1000" height="268" rx="16" fill="#0d231f"/>
