  <text x="40" y="146" font-size="14" font-weight="600" fill="#d7daf9">Arreglar primero</text>
  <text x="190" y="146" font-size="14" fill="#ffffff">Lecture 204</text>
  <text x="300" y="146" font-size="14" fill="#ffffff">No hay imagen de Camera 2</text>
  <text x="520" y="146" font-size="14" fill="#ffffff">Próxima clase a las 2 p.m.</text>
  <text x="740" y="146" font-size="14" fill="#ffffff">Revisar el cable SDI en el rack</text>
  <rect x="32" y="167" width="136" height="25" rx="12" fill="#316472"/>
