  <text x="740" y="184" font-size="14" fill="#ffffff" font-family="Söhne Mono,ui-monospace,SFMono-Regular,Menlo,monospace">/fix-problem 2</text>
  <text x="40" y="226" font-size="13" fill="#cfd3dc">Nota: 2 Pearl tienen poco o nada de espacio local. Es normal cuando las grabaciones se suben</text>
