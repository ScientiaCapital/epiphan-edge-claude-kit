name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck install.sh .claude/hooks/*.sh tests/hook-test.sh
      - name: JSON is valid
        run: |
          for f in .mcp.json .claude/settings.json; do
            jq -e . "$f" > /dev/null || { echo "$f is not valid JSON"; exit 1; }
            echo "$f ok"
          done
      - name: Shell scripts are stored with LF line endings
        run: |
          if git ls-files --eol '*.sh' | grep -v 'i/lf'; then echo "CRLF found in a .sh file"; exit 1; fi
      - name: install.ps1 is plain ASCII (Windows PowerShell 5.1 safe)
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' install.ps1; then echo "non-ASCII character in install.ps1"; exit 1; fi

  hook-tests:
    name: Hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hook and permission tests
        run: bash tests/hook-test.sh

  install-unix:
    name: Installer (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      EPIPHAN_KIT_CLONE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: First run (Europe)
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/kit
          EPIPHAN_REGION: eu
        run: bash install.sh
      - name: Installed this commit, with the Europe override
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/kit
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          test "$(git -C "$EPIPHAN_KIT_DIR" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          cd "$EPIPHAN_KIT_DIR" && claude mcp get epiphan | tee /dev/stderr | grep -q 'eu.epiphan.cloud/mcp'
      - name: Second run (North America) removes the override
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/kit
          EPIPHAN_REGION: na
        run: |
          bash install.sh
          export PATH="$HOME/.local/bin:$PATH"
          cd "$EPIPHAN_KIT_DIR" && claude mcp get epiphan | tee /dev/stderr | grep -q 'go.epiphan.cloud/mcp'

  install-no-git:
    name: Installer without git (tarball, macOS placeholder git)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Run twice with only basic tools and a git that always fails
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/kit
          EPIPHAN_REGION: au
          # The tarball path can't use the local checkout, so pin it to this commit instead of the latest release.
          EPIPHAN_KIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          for t in bash curl tar gzip mktemp mkdir cp rm touch cat env; do ln -s "$(command -v "$t")" "$bin/$t"; done
          ln -s "$HOME/.local/bin/claude" "$bin/claude"
          printf '#!/bin/sh\necho "xcrun: error: invalid active developer path" >&2\nexit 1\n' > "$bin/git"; chmod +x "$bin/git"
          PATH="$bin" bash install.sh
          echo "my notes" > "$EPIPHAN_KIT_DIR/my-notes.txt"
          PATH="$bin" bash install.sh
          test -f "$EPIPHAN_KIT_DIR/.epiphan-kit"
          test -f "$EPIPHAN_KIT_DIR/.claude/commands/connect-epiphan.md"
          grep -q "my notes" "$EPIPHAN_KIT_DIR/my-notes.txt"
          cd "$EPIPHAN_KIT_DIR" && "$HOME/.local/bin/claude" mcp get epiphan | tee /dev/stderr | grep -q 'au.epiphan.cloud/mcp'

  install-windows:
    name: Installer (windows, ${{ matrix.shell }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    env:
      EPIPHAN_KIT_CLONE: ${{ github.workspace }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: First run (Europe)
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/kit-${{ matrix.shell }}
          EPIPHAN_REGION: eu
        run: Get-Content -Raw install.ps1 | Invoke-Expression
      - name: Installed this commit, with the Europe override
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/kit-${{ matrix.shell }}
        run: |
          $env:Path += ";$HOME\.local\bin"
          if ((git -C $env:EPIPHAN_KIT_DIR rev-parse HEAD) -ne (git rev-parse HEAD)) { throw 'wrong commit installed' }
          Set-Location $env:EPIPHAN_KIT_DIR
          $out = claude mcp get epiphan | Out-String; Write-Host $out
          if ($out -notmatch 'eu\.epiphan\.cloud/mcp') { throw 'Europe override missing' }
      - name: Second run (North America) removes the override
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/kit-${{ matrix.shell }}
          EPIPHAN_REGION: na
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          $env:Path += ";$HOME\.local\bin"
          Set-Location $env:EPIPHAN_KIT_DIR
          $out = claude mcp get epiphan | Out-String; Write-Host $out
          if ($out -notmatch 'go\.epiphan\.cloud/mcp') { throw 'still not North America' }
