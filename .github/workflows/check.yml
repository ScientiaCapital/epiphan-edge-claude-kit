name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, JSON and hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh .claude/hooks/epiphan-write-guard.sh tests/hook-test.sh
      - name: JSON is valid
        run: for f in .mcp.json .claude/settings.json; do jq -e . "$f" > /dev/null && echo "$f ok"; done
      - name: Hook and permission tests
        run: bash tests/hook-test.sh
      - name: Shell scripts have LF line endings
        run: |
          if git ls-files --eol '*.sh' | grep -v 'i/lf'; then echo "CRLF found in a .sh file"; exit 1; fi

  install-unix:
    name: Installer (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: First run
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/epiphan-edge-claude-kit
        run: bash install.sh
      - name: Second run (safe to re-run)
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/epiphan-edge-claude-kit
        run: bash install.sh
      - name: Kit and Claude Code are in place
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/epiphan-edge-claude-kit
        run: |
          test -f "$EPIPHAN_KIT_DIR/.mcp.json"
          test -f "$EPIPHAN_KIT_DIR/.claude/commands/start.md"
          export PATH="$HOME/.local/bin:$PATH"
          claude --version

  install-windows:
    name: Installer (windows, ${{ matrix.shell }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: First run
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/epiphan-edge-claude-kit-${{ matrix.shell }}
        run: Get-Content -Raw install.ps1 | Invoke-Expression
      - name: Second run (safe to re-run)
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/epiphan-edge-claude-kit-${{ matrix.shell }}
        run: Get-Content -Raw install.ps1 | Invoke-Expression
      - name: Kit is in place
        env:
          EPIPHAN_KIT_DIR: ${{ runner.temp }}/epiphan-edge-claude-kit-${{ matrix.shell }}
        run: |
          if (-not (Test-Path "$env:EPIPHAN_KIT_DIR\.mcp.json")) { throw 'kit missing' }
          if (-not (Test-Path "$env:EPIPHAN_KIT_DIR\.claude\commands\start.md")) { throw 'start.md missing' }
